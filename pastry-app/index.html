<style>
/* Layout: a squared French notebook (cahier à petits carreaux). Red pen for titles, blue ballpoint for actions, yellow highlighter for the facts to memorise. */
:root{
  --paper:#fbfcfe; --grid:rgba(60,100,180,.12); --margin:rgba(214,60,70,.35);
  --ink:#1d2a4a; --ink-soft:#56627f; --red:#c2303a; --blue:#2b55c9;
  --card:#ffffff; --line:#d9dfeb; --ok:#23804e; --okbg:rgba(35,128,78,.1); --bad:#b83131; --badbg:rgba(184,49,49,.1);
  --hi:rgba(255,222,70,.6); --chip:#eef2fb;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111626; --grid:rgba(140,170,235,.07); --margin:rgba(255,110,115,.3);
  --ink:#e5e9f4; --ink-soft:#a1abc4; --red:#ff7277; --blue:#8eaaff;
  --card:#192034; --line:#2b3552; --ok:#5ccb8e; --okbg:rgba(92,203,142,.13); --bad:#ff8080; --badbg:rgba(255,128,128,.12);
  --hi:rgba(255,210,60,.3); --chip:#222b44; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111626; --grid:rgba(140,170,235,.07); --margin:rgba(255,110,115,.3);
  --ink:#e5e9f4; --ink-soft:#a1abc4; --red:#ff7277; --blue:#8eaaff;
  --card:#192034; --line:#2b3552; --ok:#5ccb8e; --okbg:rgba(92,203,142,.13); --bad:#ff8080; --badbg:rgba(255,128,128,.12);
  --hi:rgba(255,210,60,.3); --chip:#222b44; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(30px,6vw,46px);font-weight:800;color:var(--red);letter-spacing:-.01em}
h2{font-size:26px;font-weight:700;color:var(--red)}
h3{font-size:18px;font-weight:700}
p{margin:0}
a{color:var(--blue)}
mark{background:linear-gradient(transparent 35%,var(--hi) 35%);color:inherit;padding:0 2px}
.hand{font-family:var(--f-hand);font-size:22px;line-height:1.2;color:var(--blue)}
.muted{color:var(--ink-soft)}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--ink-soft)}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--margin)}
.topin{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--red);text-decoration:none;margin-right:auto}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;width:100%}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--ink-soft);font-weight:600;font-size:14px;padding:6px 11px;border-radius:7px}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--hi)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.prog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}

section.view{padding-top:28px;display:grid;gap:22px}
.intro{display:grid;gap:10px;max-width:68ch}

/* cards & lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:8px;align-content:start;min-width:0}

a.card:hover{border-color:var(--blue);transform:translateY(-1px)}
.cardtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--ink-soft);white-space:nowrap}

.tick{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:transparent}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.diff{letter-spacing:2px;color:var(--red);font-size:13px}

.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button,.btn{font:600 14px var(--f-body);border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 13px;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--blue);color:var(--blue);background:var(--chip)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.btn.good{border-color:var(--ok);color:var(--ok)}
.btn:hover{border-color:var(--blue)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* detail pages */
.detail{display:grid;gap:22px}
.back{font-weight:600;text-decoration:none}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:22px}
@media (max-width:720px){.two{grid-template-columns:minmax(0,1fr)}}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td,th{padding:7px 8px;border-bottom:1px dashed var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft)}
td.q{text-align:right;white-space:nowrap;font-weight:600}
.tablewrap{overflow-x:auto}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:12px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
ol.steps li::before{content:counter(s);font-family:var(--f-hand);font-size:24px;line-height:1;color:var(--red);text-align:center;padding-top:2px}
ul.clean{margin:0;padding-left:18px;display:grid;gap:6px}
.note{border-left:3px solid var(--red);padding:10px 14px;background:var(--card);border-radius:0 8px 8px 0}
.note.tip{border-color:var(--blue)}
.temps{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.temp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.temp b{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink)}
.ask{display:grid;gap:10px}
.ask details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.ask summary{cursor:pointer;font-weight:600}
.ask details p{margin-top:8px}
.prose{display:grid;gap:14px;max-width:72ch}
.prose h3{margin-top:10px}

/* timeline of fermentation steps */

.tl{position:relative;padding:0 0 18px 24px}
.tl::before{content:"";position:absolute;left:-8px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--red)}
.tl h3 small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--ink-soft);margin-left:6px}

/* flashcards */
.flash{perspective:1200px;max-width:560px;width:100%;margin:0 auto}
.fc{position:relative;height:260px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;place-items:center;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg);border-color:var(--blue)}
.face .big{font-family:var(--f-display);font-size:26px;font-weight:700}
@media (prefers-reduced-motion:reduce){.fc{transition:none}a.card{transition:none}}

/* quiz */
.qopts{display:grid;gap:8px}
.qopts button{text-align:left;font:500 15px var(--f-body);padding:11px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.qopts button.right{border-color:var(--ok);background:var(--okbg)}
.qopts button.wrong{border-color:var(--bad);background:var(--badbg)}
.qopts button:disabled{cursor:default}

/* tools */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.form input,.form select{font:500 16px var(--f-body);padding:8px 10px;border-radius:7px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.result{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--blue)}

.check{display:grid;gap:8px}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:5px;width:17px;height:17px;accent-color:var(--ok);flex:none}
.foot{margin-top:40px;font-size:13px;color:var(--ink-soft)}

body{font-size:16px}
.goal{background:var(--card);border:2px dashed var(--red);border-radius:12px;padding:14px 16px;display:grid;gap:4px}

.btn:disabled{opacity:.55;cursor:default}
a.btn{text-decoration:none}
.path{display:grid;gap:6px}
.parth{margin-top:18px;color:var(--red);font-size:16px}
.node{display:flex;gap:14px;align-items:center;padding:9px 12px;border-radius:12px;text-decoration:none;color:inherit;border:1.5px solid transparent}
.node .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 17px var(--f-display);flex:none;border:2.5px solid var(--line);background:var(--card);color:var(--ink-soft)}
.node .nt{display:grid;min-width:0}.node small{color:var(--ink-soft);font-size:13px}
.node.done .dot{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.node.cur{background:var(--card);border-color:var(--blue)}
.node.cur .dot{background:var(--blue);border-color:var(--blue);color:var(--paper);box-shadow:0 0 0 5px var(--chip)}

.node.lock{opacity:.5}
.node.lock .dot{font-size:15px}

.pips{display:flex;gap:6px}.pips i{width:26px;height:6px;border-radius:3px;background:var(--line)}.pips i.on{background:var(--ok)}
.bar.wide{width:100%;max-width:420px}

<script>
/* ============ CONTENT ============ */

const MODULES = [
{id:"m-steps",title:"The steps of fermentation",sub:"From weighing to cooling: what happens at every stage",min:15,html:`
<p>Every yeasted product follows the same skeleton. Learn this order by heart; the chef will use these French words.</p>
<div class="timeline">
<div class="tl"><h3>1. Pesée <small>scaling</small></h3><p>Weigh everything, including water and eggs. Professionals never use cups. Check the recipe twice.</p></div>
<div class="tl"><h3>2. Autolyse <small>optional, 20 min – 1 h</small></h3><p>Mix only flour and water, then rest. Gluten starts forming by itself, so the dough becomes smoother with less kneading. Salt and yeast (or levain) go in after. Used for baguettes, ciabatta, sourdough.</p></div>
<div class="tl"><h3>3. Pétrissage <small>mixing / kneading</small></h3><p><b>Frasage</b> = slow speed until everything is combined (about 4–5 min). Then faster speed to build gluten. Check with the <mark>window-pane test</mark> (le voile): stretch a piece thin; if light passes without tearing, the gluten is developed. Measure the dough temperature at the end. Target for most bread: <mark>24–26 °C</mark>.</p></div>
<div class="tl"><h3>4. Pointage <small>bulk fermentation, first rise</small></h3><p>The whole dough ferments in one mass. This is where <b>flavour and strength</b> develop. During pointage you can do <b>rabats</b> (folds) every 30–45 min to strengthen the dough. Can be done cold overnight (pointage en bac au froid, 4–6 °C) for more taste.</p></div>
<div class="tl"><h3>5. Division <small>dividing</small></h3><p>Cut pieces (pâtons) to an exact weight with a scraper (coupe-pâte). Cut cleanly; don't tear.</p></div>
<div class="tl"><h3>6. Préfaçonnage <small>pre-shaping</small></h3><p>Shape loosely into a ball or a short cylinder. Gives the dough an even shape before the final shaping.</p></div>
<div class="tl"><h3>7. Détente <small>bench rest, 15–30 min</small></h3><p>The gluten relaxes so the dough can be shaped without tearing. Cover it so it doesn't dry (croûter).</p></div>
<div class="tl"><h3>8. Façonnage <small>shaping</small></h3><p>Final shape: baguette, boule, bâtard, roll… Build surface tension without tearing the skin.</p></div>
<div class="tl"><h3>9. Apprêt <small>final proof</small></h3><p>Second rise after shaping, on a couche (linen), in a banneton or on trays. Bread: 24–27 °C. Viennoiserie: <mark>never above 27–28 °C</mark> or the butter melts. Can be slowed in a proofer-retarder (pousse contrôlée / chambre de fermentation). Test: press lightly with a floured finger; it should spring back slowly.</p></div>
<div class="tl"><h3>10. Grignage / Dorure <small>scoring / egg wash</small></h3><p>Bread is scored with a lame so it opens where you want (the grigne). Viennoiserie gets egg wash (dorure) instead, brushed gently so the layers don't stick.</p></div>
<div class="tl"><h3>11. Cuisson <small>baking</small></h3><p>Bread: hot deck oven with steam (buée). Viennoiserie: convection oven, lower temperature. See the oven module.</p></div>
<div class="tl"><h3>12. Ressuage <small>cooling</small></h3><p>Steam leaves the loaf and the crumb sets. Cutting hot bread makes it gummy. Rye bread needs up to 24 h.</p></div>
</div>
<div class="note tip"><span class="hand">Memory trick:</span> P-A-P-P-D-P-D-F-A-G-C-R. Or just think: <b>mix → rise → cut → shape → rest → shape → rise → bake → cool</b>. Dough always rises twice: pointage (whole mass) and apprêt (shaped pieces).</div>
`},
{id:"m-dough",title:"The basic doughs",sub:"Lean, enriched, laminated, choux, short and puff",min:20,html:`
<p>Almost every item on the list is built from one of these families. If you know which family a product belongs to, you already know half of the recipe.</p>
<h3>1. Pâte à pain (lean dough)</h3>
<p>Flour, water, salt, yeast or levain. Nothing else. Baguette, ciabatta, tourte de seigle, bagels.</p>
<p class="muted">Typical ratios: salt 1.8–2 %, fresh yeast 0.5–2 %, water 60–80 % of the flour weight.</p>
<h3>2. Pâte enrichie / pâte levée sucrée (enriched dough)</h3>
<p>Bread dough plus sugar, butter, eggs and/or milk. Softer and slower to ferment, because sugar and fat slow the yeast. Brioche, cinnamon rolls, hot cross buns, Berliner, and at the extreme end panettone and colomba.</p>
<p class="muted">Trick: add the butter at the end, once the gluten is formed, and keep the dough cool (it gets sticky above 26 °C).</p>
<h3>3. Pâte levée feuilletée (laminated yeast dough)</h3>
<p>Croissant, pain au chocolat, suisse, cube. Made of two parts:</p>
<ul class="clean"><li><b>Détrempe</b>: the dough (flour, water/milk, sugar, salt, yeast, a little butter).</li><li><b>Beurrage</b>: a flat sheet of butter locked inside the détrempe.</li><li><b>Tourage</b>: rolling and folding to create layers. A <mark>tour simple</mark> folds the dough in 3 (letter fold). A <mark>tour double</mark> (tour portefeuille) folds it in 4 (book fold).</li></ul>
<p>Classic croissant: 1 double + 1 simple turn = 4 × 3 = 12 butter layers. Or 3 simple turns = 27. More turns = finer, less defined honeycomb.</p>
<p>Butter and dough must have the <b>same firmness</b>. Butter around 10–14 °C: cold but bendable, not brittle. Rest the dough in the fridge 20–30 min between turns.</p>
<h3>4. Pâte feuilletée (puff pastry, no yeast)</h3>
<p>Same idea but without yeast, and usually 6 simple turns (729 layers). The rise comes only from steam between the layers. Chausson aux pommes, galette des rois. <b>Feuilletage inversé</b> (butter outside, dough inside) is more regular and more tender.</p>
<h3>5. Pâte à choux</h3>
<p>Water/milk + butter brought to the boil, flour added at once to make a <b>panade</b>, dried on the heat, then eggs added little by little. It puffs because the water turns into steam in the oven. Choux, éclairs, Paris-Brest.</p>
<h3>6. Pâtes friables (short pastries)</h3>
<ul class="clean"><li><b>Brisée</b>: savoury or neutral, used for quiches and often for flan parisien.</li><li><b>Sucrée</b>: with sugar and eggs, crisp, for tart shells.</li><li><b>Sablée</b>: most butter, most crumbly, like a biscuit.</li></ul>
<h3>7. Crèmes de base</h3>
<ul class="clean"><li><b>Crème pâtissière</b>: milk, yolks, sugar, starch, cooked until it boils for 1–2 min. Filling of the suisse, base of many creams. Cool it fast, covered with film touching the surface.</li><li><b>Crème d'amande</b>: butter, sugar, eggs, almond powder (equal weights).</li><li><b>Frangipane</b>: crème d'amande + crème pâtissière.</li><li><b>Crème diplomate</b>: crème pât + whipped cream (+ gelatine).</li><li><b>Craquelin</b>: butter, brown sugar, flour in equal parts, rolled 2 mm thin, put on top of choux.</li></ul>
`},
{id:"m-levain",title:"Levain and lievito madre",sub:"How to make and keep a mother dough",min:15,html:`
<p>A levain (sourdough starter) is flour and water colonised by wild yeasts and lactic bacteria. It gives taste, keeps the bread fresh longer and is the only leavening in panettone and colomba.</p>
<h3>The types</h3>
<div class="tablewrap"><table><tr><th>Name</th><th>Hydration</th><th>Used for</th></tr>
<tr><td>Levain liquide</td><td>100–125 %</td><td>Bread, baguettes. Milder, more lactic (yogurt-like) taste.</td></tr>
<tr><td>Levain dur (stiff)</td><td>50–60 %</td><td>Bread, more acetic (sour) taste, more strength.</td></tr>
<tr><td><b>Lievito madre</b></td><td>about 45–50 %</td><td>Panettone, colomba, pandoro. Stiff, sweet-smelling, kept at low acidity.</td></tr>
<tr><td>Levain de seigle</td><td>80–100 %</td><td>Rye bread. Rye needs acidity to bake properly.</td></tr>
</table></div>
<h3>Making one from zero (7–10 days)</h3>
<ol class="steps">
<li><div><b>Day 1</b>: 50 g whole wheat or rye flour + 50 g water at 26–28 °C. Cover, leave warm (25–28 °C).</div></li>
<li><div><b>Day 2</b>: Probably few bubbles. Add 50 g flour + 50 g water, mix.</div></li>
<li><div><b>Day 3 to 7</b>: Each day keep 50 g, add 50 g flour + 50 g water. It may rise a lot on day 2–3 and then go quiet: this is normal (the wrong bacteria die off).</div></li>
<li><div><b>Ready</b> when it doubles reliably 4–8 h after each feeding and smells pleasantly sour, like yogurt or apple. Then switch to white flour if you want.</div></li>
</ol>
<h3>Lievito madre (Italian mother dough)</h3>
<ul class="clean">
<li>Made from a liquid or stiff levain that is converted: refresh with <b>1 part madre : 1 part strong flour (W 300–380) : 0.42–0.45 part water</b>, knead into a smooth ball.</li>
<li>It must <mark>triple in volume in about 3.5–4 h at 26–28 °C</mark>. If it is slower, it's not strong enough for panettone yet.</li>
<li><b>Rinfresco</b> = refresh. Before panettone you do 2–3 refreshes in a row, every 3.5–4 h, to make it strong and less acidic.</li>
<li><b>Bagnetto</b>: if it smells too sour, slice it and soak 15–20 min in water at 18 °C with a pinch of sugar, then refresh.</li>
<li>Storage: <b>legato</b> (tied tightly in a cloth with string, so it ferments under pressure) or <b>in acqua</b> (submerged in water). Kept at about 18 °C between uses, or fridge for longer pauses.</li>
<li>Signs it's good: domed, honeycomb inside, sweet-milky smell, mildly acidic taste (pH around 4.1). Bad signs: strong vinegar or acetone smell, grey liquid, collapses.</li>
</ul>
<div class="note tip"><span class="hand">Say it right:</span> lievito madre (li-É-vito MA-dre) = pasta madre. In French: levain naturel, or "le chef" for the piece you keep back.</div>
`},
{id:"m-oven",title:"Ovens, ventilation and temperatures",sub:"Deck vs convection, steam, and which temperature for what",min:15,html:`
<h3>The two ovens you will see</h3>
<div class="tablewrap"><table><tr><th></th><th>Four à sole (deck oven)</th><th>Four ventilé / rotatif (convection)</th></tr>
<tr><td>How it heats</td><td>Hot stone floor + radiant heat. Strong heat from below.</td><td>A fan blows hot air around. Even, fast colouring.</td></tr>
<tr><td>Best for</td><td><b>Bread</b>: baguettes, boules, ciabatta, rye, bagels</td><td><b>Viennoiserie</b> and pastry: croissants, choux, cinnamon rolls</td></tr>
<tr><td>Steam (buée)</td><td>Yes, injected just before or right after loading</td><td>Possible on some models; little or none for viennoiserie</td></tr>
<tr><td>Temperatures</td><td>230–260 °C</td><td>155–190 °C (about <mark>20 °C lower than a static oven</mark>)</td></tr>
</table></div>
<p><b>Ventilation</b> in a bakery means the fan (ventilateur) of the convection oven. Fan = faster, more even colour, but it dries the surface. That is why viennoiserie is baked lower and why you open the vent (exura / oura) at the end of bread baking to let the steam out for a crisp crust.</p>
<h3>Why steam for bread</h3>
<ul class="clean"><li>Keeps the surface soft at the start, so the loaf can expand fully (oven spring) and the grigne opens.</li><li>Steam condenses on the dough and gelatinises the starch: shiny, thin, crackly crust.</li><li>In the last 5–10 min, open the vent (or the door) to dry the crust.</li></ul>
<h3>Temperature cheat-sheet</h3>
<div class="tablewrap"><table><tr><th>What</th><th>Temperature</th></tr>
<tr><td>Dough temperature after mixing, bread</td><td class="q">24–26 °C</td></tr>
<tr><td>Dough temperature, croissant détrempe</td><td class="q">20–24 °C</td></tr>
<tr><td>Dough temperature, panettone</td><td class="q">26–28 °C</td></tr>
<tr><td>Butter for tourage</td><td class="q">10–14 °C</td></tr>
<tr><td>Proof bread</td><td class="q">24–27 °C, 75–80 % humidity</td></tr>
<tr><td>Proof viennoiserie</td><td class="q">max 26–28 °C</td></tr>
<tr><td>Proof panettone / colomba</td><td class="q">28–30 °C</td></tr>
<tr><td>Retard / fridge</td><td class="q">2–6 °C</td></tr>
<tr><td>Baguette (deck, steam)</td><td class="q">240–250 °C, 20–25 min</td></tr>
<tr><td>Croissant (convection)</td><td class="q">165–175 °C, 15–20 min</td></tr>
<tr><td>Choux (convection)</td><td class="q">160–170 °C, 30–40 min</td></tr>
<tr><td>Panettone core temperature when done</td><td class="q">92–94 °C</td></tr>
<tr><td>Bread core temperature when done</td><td class="q">96–98 °C</td></tr>
<tr><td>Frying Berliner</td><td class="q">170–175 °C</td></tr>
<tr><td>Crème pâtissière: cook until</td><td class="q">boils 1–2 min, then cool fast below 10 °C</td></tr>
</table></div>
<h3>Water temperature (température de base)</h3>
<p>Bakers control dough temperature with the water. French method: they pick a <b>base temperature</b> (for example 54–60 for a spiral mixer) and calculate <mark>water = base − (flour temperature + room temperature)</mark>, minus the levain temperature if there is a preferment. Ask which base the bakery uses. The Calculators tab does this for you.</p>
`},
{id:"m-flour",title:"Flour, yeast, salt and baker's percentages",sub:"Reading a recipe like a professional",min:10,html:`
<h3>French flour types (T = type)</h3>
<p>The number is the ash (mineral) content. Higher number = more of the whole grain, darker, more taste, less rise.</p>
<div class="tablewrap"><table><tr><th>Type</th><th>Use</th><th>Italian / Dutch equivalent</th></tr>
<tr><td>T45</td><td>Pastry, viennoiserie, brioche</td><td>00 / patentbloem</td></tr>
<tr><td>T55</td><td>Bread, viennoiserie</td><td>0 / tarwebloem</td></tr>
<tr><td>T65</td><td>Baguette de tradition, levain breads</td><td>1</td></tr>
<tr><td>T80</td><td>Pain bis, semi-wholemeal</td><td>2</td></tr>
<tr><td>T110 / T150</td><td>Wholemeal (complète / intégrale)</td><td>integrale / volkoren</td></tr>
<tr><td>Seigle T85–T170</td><td>Rye</td><td>segale / rogge</td></tr>
</table></div>
<p><b>W</b> (Italian strength index): the higher, the stronger the gluten. Pizza W 250–280, ciabatta W 280–320, <mark>panettone W 350–400</mark>.</p>
<h3>Baker's percentages</h3>
<p>Everything is written as a percentage of the <b>total flour = 100 %</b>. So "hydration 70 %" with 1000 g flour means 700 g water. This makes any recipe easy to scale.</p>
<div class="tablewrap"><table><tr><th>Ingredient</th><th>Usual %</th></tr>
<tr><td>Salt</td><td class="q">1.8–2.2 %</td></tr>
<tr><td>Fresh yeast, direct bread</td><td class="q">1–2 %</td></tr>
<tr><td>Fresh yeast, overnight dough</td><td class="q">0.1–0.5 %</td></tr>
<tr><td>Fresh yeast, viennoiserie / brioche</td><td class="q">3–5 %</td></tr>
<tr><td>Levain in bread</td><td class="q">15–30 %</td></tr>
<tr><td>Water, baguette</td><td class="q">65–75 %</td></tr>
<tr><td>Water, ciabatta</td><td class="q">75–85 %</td></tr>
</table></div>
<h3>Yeast</h3>
<ul class="clean"><li>Fresh yeast (levure fraîche, gist) : dry instant yeast = <b>3 : 1</b>. 10 g fresh = about 3.3 g instant.</li><li>Yeast dies around 55–60 °C. Very cold water slows it a lot.</li><li><b>Salt slows yeast</b>. Don't put them directly in contact for long; add them at different moments or on opposite sides of the bowl.</li><li>Sugar above about 10 % slows yeast too (osmosis). That's why brioche needs more yeast, or osmotolerant yeast.</li></ul>
<h3>Preferments</h3>
<ul class="clean"><li><b>Poolish</b> (Polish origin): equal weights flour and water + a little yeast, 12–16 h. Liquid, gives extensibility and a nutty taste. Classic for baguettes.</li><li><b>Biga</b> (Italian): stiff, 45–55 % water, about 1 % yeast, 16–24 h at 16–18 °C. Strength and taste. Classic for ciabatta.</li><li><b>Pâte fermentée</b>: a piece of yesterday's dough added to today's.</li></ul>
`},
{id:"m-tricks",title:"Little tricks in general",sub:"The things experienced bakers do without thinking",min:10,html:`
<ul class="clean">
<li><b>Weigh water and eggs too.</b> One egg without shell is about 50 g, a yolk 20 g, a white 30 g.</li>
<li><b>Keep back some water</b> (bassinage) and add it at the end of mixing once the gluten is formed. Easier to reach high hydration.</li>
<li><b>Use the thermometer</b> constantly: dough after mixing, butter for tourage, proofing room, core of baked goods.</li>
<li><b>Flour the bench lightly</b> (fleurer). Too much flour makes dough slide when shaping and leaves raw flour in the bread.</li>
<li><b>Wet hands</b> for sticky, high-hydration dough; <b>floured hands</b> for shaping.</li>
<li><b>The poke test</b>: underproofed springs back fast, ready springs back slowly and leaves a small mark, overproofed stays dented or collapses.</li>
<li><b>Croissant tip</b>: if butter cracks while rolling, it's too cold; if it shows through or gets greasy, it's too warm. Wait, don't fight it.</li>
<li><b>Roll the lamination in one direction</b> and turn the dough 90° between turns. Brush off excess flour before folding.</li>
<li><b>Egg wash twice</b> on viennoiserie (once before proof, once before baking), always brushing in one direction, never on the cut edges (they would glue shut).</li>
<li><b>Score with confidence</b>: one fast, decisive cut. Hesitant cuts tear. Blade almost flat (30–45°) on baguettes for an ear.</li>
<li><b>Cool crème pâtissière fast</b> in a flat tray with film touching the surface. Whisk it smooth before use.</li>
<li><b>Choux</b>: never open the oven before they're coloured, or they collapse.</li>
<li><b>Cover dough</b> always (film, cloth, lid) so it doesn't form a skin.</li>
<li><b>Clean as you go</b> (nettoyer au fur et à mesure). Chefs notice this more than anything.</li>
<li><b>Write it down</b>: weights, times, temperatures of each batch. A small notebook in your apron pocket is perfect for a trial day.</li>
<li><b>Rotate trays</b> halfway through baking in ovens that colour unevenly.</li>
<li><b>Proof viennoiserie with a tray of hot water</b> in a closed oven (off) if there is no proofer, to get humidity.</li>
<li><b>Frozen viennoiserie</b>: bakeries often shape, freeze, then proof overnight in a programmable proofer. Ask about their process.</li>
</ul>
`}
];

{id:"panettone",name:"Panettone",fr:"Panettone (Milanese)",fam:"Festive sourdough",diff:3,time:"2–3 days including lievito madre refreshes",
what:"The hardest item on the list. Very rich enriched dough leavened only with lievito madre, made in two doughs (impasti), baked in paper moulds and cooled upside down.",
ing:[["Primo impasto: strong flour W 350+","300 g"],["Primo: lievito madre (refreshed 3x)","90 g"],["Primo: water","110 g"],["Primo: sugar","80 g"],["Primo: egg yolks","60 g"],["Primo: butter","90 g"],["Secondo: flour","60 g"],["Secondo: sugar","30 g"],["Secondo: yolks","70 g"],["Secondo: butter","90 g"],["Secondo: salt","4 g"],["Secondo: honey / vanilla / orange zest","10 g / 1 pod / 1"],["Candied orange + raisins","150 g + 150 g"]],
steps:["Refresh the lievito madre 2–3 times (each one triples in 3.5–4 h at 26–28 °C).","Primo impasto: flour + madre + water until strong, then sugar in parts, then yolks in parts, then soft butter. Dough 26–27 °C.","Ferment 10–12 h at 26–28 °C until it has tripled.","Secondo impasto: add primo + flour, build gluten again, then sugar, yolks and salt in parts, then butter, then flavourings, then fruit last.","Rest 45–60 min on the bench, divide, round (pirlatura) twice with buttered hands, place in paper moulds.","Proof 5–7 h at 28–30 °C until the dome is 1–2 cm below the rim.","Let a skin form 15–20 min, cut a cross (scarpatura), fold the corners, put a knob of butter in the centre.","Bake 160–170 °C, about 45–55 min for 1 kg, until the core is 92–94 °C.","Pierce with skewers at the base and hang upside down for 8–12 h."],
temps:[["Lievito madre","triples in 3.5–4 h at 27 °C"],["Fermentations","26–30 °C"],["Core when done","92–94 °C"],["Cool","upside down 8–12 h"]],
tricks:["Add sugar, yolks and butter in parts, waiting for each to be absorbed: the gluten must never break.","The dough is ready when it's glossy and comes away from the bowl like a veil.","Dough temperature above 28 °C makes the butter separate: stop and cool the bowl."],
mistakes:["Weak lievito madre: dense, sour panettone.","Not hanging upside down: it collapses on itself."],
ask:[["Why upside down?","The crumb is so soft and rich that it collapses under its own weight while hot. Hanging it keeps the dome and the airy structure."],["Why two doughs?","The first ferments long to build strength and flavour; the second adds most of the sugar, fat and fruit without killing the fermentation."]]},

const PARTS=[
 {title:"Part 1 · The basics",ids:["m-steps","m-dough","m-flour","m-oven","m-levain","m-tricks"]},

PARTS.forEach(p=>p.ids.forEach(id=>{const m=MODULES.find(x=>x.id===id),r=RECIPES.find(x=>x.id===id);STEPS.push({id,part:p.title,kind:m?"m":r?"r":"t",item:m||r||null,title:m?m.title:r?r.name:"Trial day checklist"})}));

const KEY="fournil-v2";

try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}

const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dots=n=>"●".repeat(n)+"○".repeat(3-n);
const unlocked=i=>i===0||!!S.passed[STEPS[i-1].id];
const doneN=()=>STEPS.filter(s=>S.passed[s.id]).length;
const allDone=()=>doneN()===STEPS.length;
const basicsDone=()=>PARTS[0].ids.every(id=>S.passed[id]);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prepQ(q){const idx=shuffle(q[1].map((_,i)=>i));return {t:q[0],opts:idx.map(i=>q[1][i]),ans:idx.indexOf(q[2]),why:q[3]}}
function sundayText(){const n=(7-new Date().getDay())%7;return n===0?"Sunday is today. You've got this!":n===1?"Sunday is tomorrow.":n+" days until Sunday."}
function goal(){return S.bigPassed
 ?`<div class="goal win"><span class="hand">You passed the Big Test</span><b>You're ready for Sunday!</b><span class="muted">${sundayText()} Keep reviewing with the flashcards if you like.</span></div>`

 document.getElementById("nav-extras").textContent=(basicsDone()?"":"🔒 ")+"Extras";document.getElementById("nav-big").textContent=(allDone()?"":"🔒 ")+"Big Test"}

 if(cur>=0)html+=`<a class="btn primary big" href="#s-${STEPS[cur].id}">${cur===0?"Start step 1":"Continue: step "+(cur+1)+" · "+esc(STEPS[cur].title)} →</a>`;

  p.ids.forEach(id=>{const i=STEPS.findIndex(s=>s.id===id),st=STEPS[i],done=S.passed[id],open=unlocked(i);

   html+=open?`<a class="node ${cls}" href="#s-${id}">${inner}</a>`:`<div class="node lock" aria-disabled="true">${inner}</div>`});});

  :`<div class="card" style="text-align:center"><h2>Deck finished</h2><p>You knew ${DECKS[deck].length-missed.size} of ${DECKS[deck].length} on the first try.</p><div class="row" style="justify-content:center"><button class="btn primary" data-deck="${esc(deck)}">Restart this deck</button></div></div>`;
  return `<section class="view"><div class="intro"><span class="hand">Repeat until it sticks</span><h1>Flashcards</h1><p>Cards you miss go back to the end of the pile.</p></div>
  <div class="filters" role="group" aria-label="Deck">${Object.keys(DECKS).map(d=>`<button data-deck="${esc(d)}" aria-pressed="${d===deck}">${esc(d)} (${DECKS[d].length})</button>`).join("")}</div>${body}</section>`;
}

/* tools */
function viewTools(){
  return `<section class="view"><div class="intro"><span class="hand">Bakery maths</span><h1>Calculators</h1></div>
  <div class="card"><h2>Water temperature</h2><p class="muted">To hit the right dough temperature after mixing. Water = (target × factors) − (flour + room + friction [+ preferment]).</p>
  <div class="form">
   <label for="t-target">Target dough °C<input id="t-target" type="number" value="25" inputmode="decimal"></label>
   <label for="t-flour">Flour °C<input id="t-flour" type="number" value="20" inputmode="decimal"></label>
   <label for="t-room">Room °C<input id="t-room" type="number" value="22" inputmode="decimal"></label>
   <label for="t-fric">Friction °C<select id="t-fric"><option value="3">By hand (≈3)</option><option value="10" selected>Spiral mixer (≈10)</option><option value="14">Fork/long mix (≈14)</option></select></label>
   <label for="t-pre">Preferment °C (empty if none)<input id="t-pre" type="number" placeholder="none" inputmode="decimal"></label>
  </div>
  <p>Use water at <span class="result" id="t-out">—</span></p><p class="muted" id="t-note"></p></div>
  <div class="card"><h2>Baker's percentage scaler</h2><p class="muted">Enter the flour weight and percentages; everything else follows.</p>
  <div class="form">
   <label for="b-flour">Flour (g)<input id="b-flour" type="number" value="1000" inputmode="decimal"></label>
   <label for="b-hyd">Hydration %<input id="b-hyd" type="number" value="70" inputmode="decimal"></label>
   <label for="b-salt">Salt %<input id="b-salt" type="number" value="1.8" step="0.1" inputmode="decimal"></label>
   <label for="b-yeast">Fresh yeast %<input id="b-yeast" type="number" value="0.5" step="0.1" inputmode="decimal"></label>
   <label for="b-lev">Levain %<input id="b-lev" type="number" value="20" inputmode="decimal"></label>
   <label for="b-piece">Piece weight (g)<input id="b-piece" type="number" value="350" inputmode="decimal"></label>
  </div>
  <div class="tablewrap"><table id="b-out"></table></div></div>
  <div class="card"><h2>Yeast converter</h2><div class="form"><label for="y-fresh">Fresh yeast (g)<input id="y-fresh" type="number" value="20" inputmode="decimal"></label></div><p>= <b id="y-out"></b> instant dry yeast, or <b id="y-out2"></b> active dry yeast.</p></div>
  </section>`;
}
function calcTools(){
  const v=id=>parseFloat(document.getElementById(id).value);
  const tg=v("t-target"),fl=v("t-flour"),rm=v("t-room"),fr=v("t-fric"),pre=v("t-pre");
  const hasPre=!isNaN(pre);const n=hasPre?4:3;
  const w=tg*n-(fl+rm+fr+(hasPre?pre:0));
  document.getElementById("t-out").textContent=isNaN(w)?"—":w.toFixed(0)+" °C";
  document.getElementById("t-note").textContent=isNaN(w)?"":w<2?"Below 2 °C: use ice (or crushed ice + water) and chill the flour.":w>45?"Above 45 °C risks harming the yeast; warm the room or flour instead.":"Measure the dough after mixing and adjust next time.";
  const F=v("b-flour"),h=v("b-hyd"),s=v("b-salt"),y=v("b-yeast"),l=v("b-lev"),pc=v("b-piece");
  const rows=[["Flour",F],["Water",F*h/100],["Salt",F*s/100],["Fresh yeast",F*y/100],["Levain",F*l/100]];
  const tot=rows.reduce((a,r)=>a+(r[1]||0),0);
  document.getElementById("b-out").innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td class="q">${isNaN(r[1])?"—":(r[1]<20?r[1].toFixed(1):Math.round(r[1]))+" g"}</td></tr>`).join("")+`<tr><td><b>Total dough</b></td><td class="q">${Math.round(tot)} g</td></tr><tr><td><b>Pieces of ${pc||"?"} g</b></td><td class="q">${pc>0?Math.floor(tot/pc):"—"}</td></tr>`;
  const yf=v("y-fresh");document.getElementById("y-out").textContent=isNaN(yf)?"—":(yf/3).toFixed(1)+" g";document.getElementById("y-out2").textContent=isNaN(yf)?"—":(yf/2.5).toFixed(1)+" g";
}

function viewGlossary(){
  return `<section class="view"><div class="intro"><span class="hand">Les mots du fournil</span><h1>Glossary</h1><p>The words the chef will use. Search to find one fast.</p></div>
  <div class="form" style="max-width:360px"><label for="g-search">Search<input id="g-search" type="search" placeholder="e.g. apprêt"></label></div>
  <div class="card"><div class="tablewrap"><table id="g-tab"></table></div></div></section>`;
}
function fillGlossary(q){q=(q||"").toLowerCase();document.getElementById("g-tab").innerHTML=GLOSSARY.filter(g=>(g[0]+g[1]).toLowerCase().includes(q)).map(g=>`<tr><td><b>${esc(g[0])}</b></td><td>${esc(g[1])}</td></tr>`).join("")||`<tr><td class="muted">No word matches. Try fewer letters.</td></tr>`}



/* ============ ROUTER ============ */
function route(){
 const h=(location.hash||"#path").slice(1);let html,tab="path";
 if(/^[sc]-/.test(h)){const i=STEPS.findIndex(s=>s.id===h.slice(2));if(i<0||!unlocked(i)){location.replace("#path");return}
  html=h[0]==="s"?viewLesson(STEPS[i],i):viewCheck(STEPS[i],i)}
 else if(h==="big"){html=viewBig();tab="big"}
 else if(["extras","cards","tools","glossary"].includes(h)){tab="extras";
  html=!basicsDone()?viewLockedExtras():h==="extras"?viewExtras():`<div class="view" style="padding-top:20px"><a class="back" href="#extras">← Extras</a></div>`+({cards:viewCards,tools:viewTools,glossary:viewGlossary})[h]()}
 else html=viewPath();
 app.innerHTML=html+`<p class="foot">Progress is saved in this browser only.</p>`;
 document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.getAttribute("href")==="#"+tab)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
 if(basicsDone()&&h==="tools")calcTools();
 if(basicsDone()&&h==="glossary")fillGlossary("");
 updProg();
}
let lastHash=location.hash;
window.addEventListener("hashchange",()=>{resetArm=false;route();if(location.hash!==lastHash)window.scrollTo(0,0);lastHash=location.hash});
const top0=()=>window.scrollTo(0,0);
app.addEventListener("click",e=>{
 const t=e.target.closest("button,.fc");if(!t)return;const d=t.dataset;
 if(d.deck){startDeck(d.deck);route()}
 else if(t.id==="fc"){t.classList.toggle("flip")}
 else if(d.fc){const c=order[ci];if(d.fc==="know"){ci++}else{missed.add(c.f);order.push(order.splice(ci,1)[0])}route()}
 else if(d.copt!==undefined){C.picked=+d.copt;if(C.picked!==C.qs[C.queue[0]].ans)C.mist++;route()}
 else if(d.cnext){const k=C.queue.shift();if(C.picked!==C.qs[k].ans)C.queue.push(k);C.picked=null;route();top0()}
 else if(d.bstart){if(d.bstart==="again")newBig();B.started=true;route();top0()}
 else if(d.bopt!==undefined){const k=+d.bopt,q=B.qs[B.i];B.picked=k;if(k===q.ans)B.score++;else B.missed.push({t:q.t,why:q.opts[q.ans]+". "+q.why});route()}
 else if(d.bnext){B.i++;B.picked=null;route();top0()}
 else if(d.finish){S.passed[d.finish]=true;save();route()}
 else if(d.reset){if(d.reset==="ask")resetArm=true;else{if(d.reset==="yes"){S={passed:{},trial:{},bigBest:null,bigPassed:false};save();C=null;B=null}resetArm=false}route()}
});
app.addEventListener("keydown",e=>{if(e.target.id==="fc"&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.classList.toggle("flip")}});
app.addEventListener("input",e=>{if(e.target.closest(".form")&&location.hash==="#tools")calcTools();if(e.target.id==="g-search")fillGlossary(e.target.value)});
app.addEventListener("change",e=>{if(e.target.dataset.trial!==undefined){S.trial[e.target.dataset.trial]=e.target.checked;save();const y=window.scrollY;route();window.scrollTo(0,y)}});
route();
</script>
